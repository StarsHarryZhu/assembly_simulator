<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assembly Simulator · MIPS32</title>
<meta name="description" content="在浏览器里写 MIPS 汇编、逐行执行、看寄存器和内存怎么变；支持 MARS 4.5 的全部指令。">
<script>
  // Apply the saved theme before first paint so the page never flashes the wrong colours.
  try {
    var t = JSON.parse(localStorage.getItem('asmsim.theme') || 'null')
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
